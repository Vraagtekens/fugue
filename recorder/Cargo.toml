[package]
name = "midi"
version = "0.1.0"
edition = "2024"

[dependencies]
chrono = "0.4.42"
dotenvy = "0.15"
futures-util = "0.3"
reqwest = { version = "0.13.1", features = ["multipart", "json", ] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
serde_json = "1"

midir = "0.10"
midly = "0.5"
